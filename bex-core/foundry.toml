[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# Settlement's settle() has many local variables and needs the IR pipeline to compile;
# This is also the recommended setting for the release build (used together with optimize).
via_ir = true
# Strictly read-only access to public Beacon consensus test vectors.
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
